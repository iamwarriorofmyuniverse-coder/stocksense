replenishment:
  default_service_level: 0.95    # Target cycle service level (95%)
  default_lead_time_days: 3      # Supplier delivery lead time
  review_period_days: 7          # Periodic review interval R (order every 7 days or continuous)
  
economics:
  unit_holding_cost_rate: 0.02   # 2% of unit cost per day holding cost
  stockout_penalty_multiplier: 1.5 # 1.5x of unit retail price for lost sales / brand damage
  perishability_shelf_life_days: 14 # For perishable goods (FOODS), shelf life
  salvage_value_fraction: 0.20   # Discounted salvage value upon expiration
