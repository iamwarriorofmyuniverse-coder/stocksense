lightgbm:
  objective: "tweedie"           # Tweedie distribution is ideal for zero-inflated continuous/count retail sales
  tweedie_variance_power: 1.2    # Between 1 (Poisson) and 2 (Gamma)
  metric: "mae"
  boosting_type: "gbdt"
  n_estimators: 300
  learning_rate: 0.05
  num_leaves: 63
  subsample: 0.8
  colsample_bytree: 0.8
  random_state: 42
  n_jobs: -1
  verbose: -1

early_stopping_rounds: 30
